function barChart(id,rows,o={}){const s=svgClear(id),W=s.clientWidth||520,H=s.clientHeight||290,l=o.left||100,r=28,t=18,b=34;rows=rows.slice(0,o.limit||12);const max=Math.max(1,...rows.map(d=>d.value));rows.forEach((d,i)=>{const y=t+i*((H-t-b)/rows.length),h=Math.max(5,(H-t-b)/rows.length-6),w=(W-l-r)*d.value/max;s.appendChild(el('rect',{x:l,y,width:w,height:h,rx:3,fill:d.color||'#66b8e6'}));let tx=el('text',{x:l-8,y:y+h*.68,'text-anchor':'end',class:'barLabel'});tx.textContent=d.label;s.appendChild(tx)});for(let i=0;i<=4;i++){let x=l+(W-l-r)*i/4;s.appendChild(el('line',{x1:x,x2:x,y1:t,y2:H-b,class:'axis'}));let tx=el('text',{x,y:H-10,'text-anchor':'middle',class:'tick'});tx.textContent=i?fmt(max*i/4):'0';s.appendChild(tx)}}
function lineChart(id,series,selectedY,o={}){const s=svgClear(id),W=s.clientWidth||520,H=s.clientHeight||290,l=44,r=18,t=18,b=34,xs=years;let vals=series.flatMap(se=>se.values.map(d=>d.v)).filter(v=>isFinite(v));let min=o.zero?0:Math.min(...vals),max=Math.max(...vals);if(max==min)max=min+1;for(let i=0;i<=4;i++){let y=t+(H-t-b)*i/4;s.appendChild(el('line',{x1:l,x2:W-r,y1:y,y2:y,class:'axis'}));let tx=el('text',{x:l-8,y:y+4,'text-anchor':'end',class:'tick'});tx.textContent=fmt(max-(max-min)*i/4);s.appendChild(tx)}xs.forEach((yy,i)=>{if(i%2===0||yy==selectedY){let x=l+(W-l-r)*i/(xs.length-1);let tx=el('text',{x,y:H-10,'text-anchor':'middle',class:'tick'});tx.textContent=yy;s.appendChild(tx)}});let sx=l+(W-l-r)*(xs.indexOf(selectedY))/(xs.length-1);s.appendChild(el('line',{x1:sx,x2:sx,y1:t,y2:H-b,stroke:'#f0b33e','stroke-width':2,'stroke-dasharray':'4 4'}));series.forEach(se=>{let pts=se.values.filter(d=>xs.includes(d.year)).map(d=>[l+(W-l-r)*(xs.indexOf(d.year))/(xs.length-1),t+(H-t-b)*(1-(d.v-min)/(max-min)),d.year]);s.appendChild(el('path',{d:'M'+pts.map(p=>p[0]+','+p[1]).join(' L'),fill:'none',stroke:se.color,'stroke-width':2.5,'stroke-linejoin':'round'}));pts.forEach(p=>{if(p[2]==selectedY)s.appendChild(el('circle',{cx:p[0],cy:p[1],r:4,fill:se.color,stroke:'#fff','stroke-width':2}))})})}
function priceCombo(y){let rows=byYear(DATA.price,y).filter(d=>d.game_count>0);const s=svgClear('priceChart'),W=s.clientWidth||520,H=s.clientHeight||290,l=46,r=38,t=18,b=42,max=Math.max(1,...rows.map(d=>d.game_count));rows.forEach((d,i)=>{let x=l+i*(W-l-r)/rows.length+8,bw=(W-l-r)/rows.length-16,h=(H-t-b)*d.game_count/max;s.appendChild(el('rect',{x,y:H-b-h,width:bw,height:h,rx:4,fill:'#67b7e8'}));let tx=el('text',{x:x+bw/2,y:H-12,'text-anchor':'middle',class:'tick'});tx.textContent=d.price_range;s.appendChild(tx)});let pts=rows.map((d,i)=>[l+i*(W-l-r)/rows.length+((W-l-r)/rows.length)/2,t+(H-t-b)*(1-((d.avg_positive_ratio_pct||50)-50)/50)]);if(pts.length)s.appendChild(el('path',{d:'M'+pts.map(p=>p.join(',')).join(' L'),fill:'none',stroke:'#efb235','stroke-width':3}));pts.forEach(p=>s.appendChild(el('circle',{cx:p[0],cy:p[1],r:3.5,fill:'#efb235'})))}
function renderTables(y){let top=byYear(DATA.top,y).sort((a,b)=>a.rank-b.rank).slice(0,5);topGames.innerHTML=`<tr><th>#</th><th>${CN.game}</th><th>${CN.genre}</th><th>${CN.score}</th><th>${CN.rating}</th><th>${CN.price}</th></tr>`+top.map(d=>`<tr><td class="rank">${d.rank}</td><td>${d.name}</td><td><span class="tag">${d.genre}</span></td><td class="score">${Number(d.score).toFixed(1)}</td><td>${pct(d.positive_ratio_pct)}</td><td>${money(d.price)}</td></tr>`).join('');let best=byYear(DATA.best,y).sort((a,b)=>b.score-a.score).slice(0,8);bestGames.innerHTML=`<tr><th>${CN.genre}</th><th>${CN.bestGame}</th><th>${CN.score}</th></tr>`+best.map(d=>`<tr><td><span class="tag">${d.genre}</span></td><td>${d.name}</td><td class="score">${Number(d.score).toFixed(1)}</td></tr>`).join('')}
function update(y){
  yearBadge.textContent=y;
  yearTitle.textContent=y;
  let m=one(DATA.yearly,y);
  let tagLine=[m.top_tag_1,m.top_tag_2,m.top_tag_3].filter(Boolean).join(' / ');
  yearSummary.textContent=`${CN.topTags}${CN.colon}${tagLine}${CN.dot}${CN.releasedN} ${fmt(m.n_total_raw)} ${CN.games}${CN.comma}${CN.sample} ${fmt(m.n_games)} ${CN.games}`;
  let kk=[[CN.released,fmt(m.n_total_raw)],[CN.reviewed,fmt(m.n_games)],[CN.medianPrice,money(m.median_price)],[CN.medianRating,pct(m.median_positive_ratio_pct)],[CN.avgPlaytime,fmt(Math.round(m.avg_playtime_hours))+CN.hours],[CN.totalReviews,fmt(m.total_reviews)]];
  kpis.innerHTML=kk.map(k=>`<div class="kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('');
  profile.innerHTML=[
    [CN.topGenre,m.top_genre,`${pct(m.top_genre_pct)}${CN.dot}${fmt(m.top_genre_count)}${CN.games}`],
    [CN.preferredPrice,m.preferred_price_range,`${CN.rating} ${pct(m.preferred_price_rating_pct)}`],
    [CN.longPlay,m.longest_playtime_genre,`${fmt(Math.round(m.longest_playtime_hours))}${CN.hours}`],
    [CN.signals,`${m.top_tag_1} / ${m.top_tag_2}`,`${CN.coverage} ${pct(m.filtered_coverage_pct)}`]
  ].map(x=>`<div class="mini"><small>${x[0]}</small><strong>${x[1]||'-'}</strong><em>${x[2]||''}</em></div>`).join('');
  let colors=['#4fa3d8','#f2b84b','#52b788','#d77aa8','#42a5a1','#a88fd8','#ef7d73'];
  barChart('genreBar',byYear(DATA.genre,y).sort((a,b)=>b.game_count-a.game_count).map((d,i)=>({label:d.genre,value:d.game_count,color:colors[i%colors.length]})),{left:128,limit:14});
  priceCombo(y);
  wordcloud.innerHTML=byYear(DATA.words,y).slice(0,45).map((d,i)=>`<span style="font-size:${12+d.normalized_value/4}px;--rot:${[-10,0,8,-6,4][i%5]}deg;--c:${colors[i%colors.length]}">${d.word}</span>`).join('');
  renderTables(y);
  note.textContent=`${y} ${CN.bizPrefix}${CN.colon}${CN.observe1} ${m.top_genre||'-'} ${CN.observe2}${CN.comma}${CN.priceRef} ${m.preferred_price_range||'-'}${CN.comma}${CN.ratingMedian} ${pct(m.median_positive_ratio_pct)}${CN.period}${CN.tagLead} ${tagLine} ${CN.tagHint}${CN.semicolon}${CN.bizCaveat}`;
  let first=DATA.yearly[0], latest=DATA.yearly[DATA.yearly.length-1];
  let releaseGrowth=Math.round((latest.n_total_raw/first.n_total_raw-1)*100);
  let priceGrowth=Math.round((latest.median_price/first.median_price-1)*100);
  document.getElementById('conclusionTrend').textContent=`从${first.year}年至${latest.year}年，样本中的上架数量约增长${releaseGrowth}%，价格中位数由${money(first.median_price)}升至${money(latest.median_price)}；近年好评率中位数回升至${pct(latest.median_positive_ratio_pct)}。整体趋势是供给扩张、价格上移、口碑改善，但竞争也更充分。`;
  document.getElementById('conclusionAction').textContent=`优先验证“${m.top_genre} + ${m.top_tag_1} / ${m.top_tag_2}”这类内容组合，先做小规模原型和商店页测试；价格可把${m.preferred_price_range}作为首轮对照区间，再根据愿望单、转化率和留存调整。`;
  document.getElementById('conclusionRisk').textContent=`类型集中度较高，单凭${m.top_genre}或高好评率不能证明商业成功；同时${y}年的样本覆盖率仅为${pct(m.filtered_coverage_pct)}，年度数据存在不完整风险，不能直接外推市场规模或收入。`;
  lineChart('gamesTrend',[{color:'#4fa3d8',values:DATA.trend.map(d=>({year:d.year,v:d.n_total_raw}))},{color:'#82c55b',values:DATA.trend.map(d=>({year:d.year,v:d.n_games}))}],y,{zero:true});
  lineChart('ratingTrend',[{color:'#52b788',values:DATA.trend.map(d=>({year:d.year,v:d.median_positive_ratio_pct}))}],y);
  lineChart('priceTrend',[{color:'#f2b84b',values:DATA.trend.map(d=>({year:d.year,v:d.median_price}))}],y,{zero:true});
  let gs=['Action','Adventure','Casual','Indie','Simulation'];
  lineChart('genreTrend',gs.map((g,i)=>({color:colors[i],values:DATA.genreTrend.filter(d=>d.genre==g).map(d=>({year:d.year,v:d.game_count}))})),y,{zero:true});
  yearTable.innerHTML='<tr>'+[CN.year,CN.releasedN,CN.reviewedN,CN.medianPrice,CN.medianRating,CN.avgTime,CN.totalReviews,CN.topGenre,CN.preferredPrice,CN.topTag].map(h=>`<th>${h}</th>`).join('')+'</tr>'+DATA.yearly.map(d=>`<tr class="${d.year==y?'activeRow':''}"><td>${d.year}</td><td>${fmt(d.n_total_raw)}</td><td>${fmt(d.n_games)}</td><td>${money(d.median_price)}</td><td>${pct(d.median_positive_ratio_pct)}</td><td>${fmt(Math.round(d.avg_playtime_hours))}${CN.hours}</td><td>${fmt(d.total_reviews)}</td><td>${d.top_genre}</td><td>${d.preferred_price_range}</td><td>${d.top_tag_1}</td></tr>`).join('')
}
yearRange.addEventListener('input',e=>update(+e.target.value));update(+yearRange.value);window.addEventListener('resize',()=>update(+yearRange.value));
</script>
